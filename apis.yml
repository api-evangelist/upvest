url: https://raw.githubusercontent.com/api-evangelist/upvest/refs/heads/main/apis.yml
name: Upvest
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/upvest.png
tags:
  - Banking Infrastructure
  - Fintech
  - Investments
  - Securities
  - Fractional Investing
  - Custody
  - Wealth Management
description: >-
  Upvest is a Berlin-based API-first investment infrastructure provider that enables banks, brokers, and wealth managers
  to build and launch investment experiences through a single modular API. Founded in 2017, Upvest is a regulated
  securities institution in Europe and the UK, covering trading, custody, and back-office operations. The platform
  supports fractional investing, portfolios, savings plans, roundups, and direct debit, enabling clients like Bunq, DKB,
  N26, Revolut, and Raisin to offer investment products to their customers.
created: '2026-03-24'
modified: '2026-05-19'
